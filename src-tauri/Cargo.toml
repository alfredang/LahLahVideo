[package]
name = "lahlah-video"
version = "1.1.3"
description = "LahLah Video: a simple CapCut-style video editor for the Claude to Higgsfield to TikTok/YouTube workflow"
authors = ["Dr Alfred Ang <alfred@tertiaryinfotech.com>"]
license = "MIT"
repository = "https://github.com/alfredang/LahLahVideo"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lahlah_video_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7.4", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = ["protocol-asset"] }
tauri-plugin-deep-link = "~2.6.3"
tauri-plugin-dialog = "~2.8.4"
tauri-plugin-fs = "~2.7.1"
tauri-plugin-http = "~2.8.3"
tauri-plugin-opener = "~2.7.2"
tauri-plugin-shell = "~2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
getrandom = "0.3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "~2.5.5", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
