name: Release

# Push a tag like v2.0.0 to build the Mac .dmg files and the Windows .exe and attach them
# to a GitHub Release. Pushes to wip/** or release-test/** branches, or a manual run, build without releasing.
on:
  push:
    tags: ["v*"]
    branches: ["wip/**", "release-test/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Bundle FFmpeg as a sidecar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-ffmpeg.mjs --target ${{ matrix.target }}

      # tauri-bundler fetches NSIS from GitHub release links; fetch it through the API first so a
      # flaky release CDN does not break the Windows build. Tauri skips its own download if present.
      - name: Pre-fetch the NSIS toolchain
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tools = Join-Path $env:LOCALAPPDATA 'tauri'
          if (-not (Test-Path "$tools\NSIS\makensis.exe")) {
            New-Item -ItemType Directory -Force -Path $tools | Out-Null
            gh release download nsis-3.13 -R tauri-apps/binary-releases -p 'nsis-3.13.zip' -D $env:RUNNER_TEMP --clobber
            Expand-Archive "$env:RUNNER_TEMP\nsis-3.13.zip" -DestinationPath $tools -Force
            Rename-Item "$tools\nsis-3.13" 'NSIS'
            $add = "$tools\NSIS\Plugins\x86-unicode\additional"
            New-Item -ItemType Directory -Force -Path $add | Out-Null
            gh release download nsis_tauri_utils-v0.5.3 -R tauri-apps/nsis-tauri-utils -p 'nsis_tauri_utils.dll' -D $add --clobber
          }
          Get-ChildItem "$tools\NSIS" | Select-Object -First 5

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "LahLah Video ${{ github.ref_name }}"
          releaseBody: |
            **Install in one line**

            Mac (Terminal): `curl -fsSL https://raw.githubusercontent.com/alfredang/LahLahVideo/main/install/install.sh | bash`

            Windows (PowerShell): `irm https://raw.githubusercontent.com/alfredang/LahLahVideo/main/install/install.ps1 | iex`

            Or download below: `_aarch64.dmg` for Apple silicon Macs, `_x64.dmg` for Intel Macs, `_x64-setup.exe` for Windows.

            **Use it from Claude:** double-click `lahlah-video.mcpb` (Claude Desktop installs the LahLah Video extension), or for Claude Code: `claude mcp add lahlah-video -- npx -y https://github.com/alfredang/LahLahVideo/releases/latest/download/lahlah-video-mcp.tgz`
            The app is not signed by Apple or Microsoft yet; the README explains the one extra click.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Keep the installers as build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: lahlah-video-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  claude:
    name: Claude extension (.mcpb) and MCP package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Build, test and pack
        working-directory: mcp
        run: |
          npm ci
          npm test
          mkdir -p ../dist-release
          npm run bundle
          npm pack --pack-destination ../dist-release
          mv ../dist-release/lahlah-video-mcp-*.tgz ../dist-release/lahlah-video-mcp.tgz
          ls -la ../dist-release
      - name: Attach to the release, plus fixed-name copies of the installers
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "$TAG" dist-release/lahlah-video.mcpb dist-release/lahlah-video-mcp.tgz --clobber
          # releases/latest/download/LahLahVideo_<arch> works without the (rate-limited) API.
          mkdir -p stable && cd stable
          gh release download "$TAG" -R "${{ github.repository }}" -p '*_aarch64.dmg' -p '*_x64.dmg' -p '*_x64-setup.exe'
          for f in *_aarch64.dmg; do cp "$f" LahLahVideo_aarch64.dmg; done
          for f in *_x64.dmg; do cp "$f" LahLahVideo_x64.dmg; done
          for f in *_x64-setup.exe; do cp "$f" LahLahVideo_x64-setup.exe; done
          gh release upload "$TAG" LahLahVideo_aarch64.dmg LahLahVideo_x64.dmg LahLahVideo_x64-setup.exe --clobber
      - name: Keep as build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: lahlah-video-claude
          path: dist-release/*
