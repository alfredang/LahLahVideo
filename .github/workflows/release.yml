name: Release

# Push a tag like v2.0.0 to build the Mac .dmg files and the Windows .exe and attach them
# to a GitHub Release. Pushes to wip/** or release-test/** branches, or a manual run, build without releasing.
on:
  push:
    tags: ["v*"]
    branches: ["wip/**", "release-test/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Bundle FFmpeg as a sidecar
        run: node scripts/fetch-ffmpeg.mjs --target ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "LahLah Video ${{ github.ref_name }}"
          releaseBody: |
            **Install in one line**

            Mac (Terminal): `curl -fsSL https://raw.githubusercontent.com/alfredang/LahLahVideo/main/install/install.sh | bash`

            Windows (PowerShell): `irm https://raw.githubusercontent.com/alfredang/LahLahVideo/main/install/install.ps1 | iex`

            Or download below: `_aarch64.dmg` for Apple silicon Macs, `_x64.dmg` for Intel Macs, `_x64-setup.exe` for Windows.
            The app is not signed by Apple or Microsoft yet; the README explains the one extra click.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Keep the installers as build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: lahlah-video-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
